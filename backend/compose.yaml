services:
    laravel.test:
        build:
            context: './vendor/laravel/sail/runtimes/8.5'
            dockerfile: Dockerfile
            args:
                WWWGROUP: '${WWWGROUP}'
        image: 'sail-8.5/app'
        extra_hosts:
            - 'host.docker.internal:host-gateway'
        ports:
            - '${VITE_PORT:-5173}:${VITE_PORT:-5173}'
            # A device has neither the hosts entry for Traefik's hostname nor trust in its cert.
            - '${APP_PORT:-8029}:80'
        environment:
            WWWUSER: '${WWWUSER}'
            LARAVEL_SAIL: 1
            XDEBUG_MODE: '${SAIL_XDEBUG_MODE:-off}'
            XDEBUG_CONFIG: '${SAIL_XDEBUG_CONFIG:-client_host=host.docker.internal}'
            IGNITION_LOCAL_SITES_PATH: '${PWD}'
            VITE_PORT: '${VITE_PORT:-5173}'
        labels:
            - 'traefik.enable=true'
            - 'traefik.docker.network=web'
            - 'traefik.http.routers.${APP_SLUG}.rule=Host(`${APP_SLUG}.${BASE_DOMAIN}`)'
            - 'traefik.http.routers.${APP_SLUG}.priority=100'
            - 'traefik.http.routers.${APP_SLUG}.entrypoints=websecure'
            - 'traefik.http.routers.${APP_SLUG}.tls=true'
            - 'traefik.http.routers.${APP_SLUG}.service=${APP_SLUG}'
            - 'traefik.http.services.${APP_SLUG}.loadbalancer.server.port=80'
            # Vite must share the app page's https origin or the browser blocks assets as mixed content.
            - 'traefik.http.routers.${APP_SLUG}-vite.rule=Host(`vite.${APP_SLUG}.${BASE_DOMAIN}`)'
            - 'traefik.http.routers.${APP_SLUG}-vite.priority=100'
            - 'traefik.http.routers.${APP_SLUG}-vite.entrypoints=websecure'
            - 'traefik.http.routers.${APP_SLUG}-vite.tls=true'
            - 'traefik.http.routers.${APP_SLUG}-vite.service=${APP_SLUG}-vite'
            - 'traefik.http.services.${APP_SLUG}-vite.loadbalancer.server.port=${VITE_PORT:-5173}'
        volumes:
            # The repo root sits above the app mount, and .ai, packages and the guard tests all read it.
            - '..:/var/www'
            - '.:/var/www/html'
        networks:
            - sail
            - web
        depends_on:
            redis:
                condition: service_healthy
            mailpit:
                condition: service_started
    # The instrumented twin of laravel.test: same image, same mounts, but xdebug is
    # listening and Telescope/Debugbar record every request. The cost is per request to
    # this host, not per container, so it comes up with everything else and laravel.test
    # stays as fast as it was.
    laravel.debug:
        image: 'sail-8.5/app'
        # start-container execs whatever argv it is given, bypassing supervisord, which also
        # starts queue:work and schedule:work — a second copy would double-process every job
        # and fire every scheduled command twice against the same database.
        # --no-reload: without it artisan serve rebuilds the child process env from a fixed
        # allowlist plus a fresh .env read, silently discarding every override below.
        command:
            - 'php'
            - '/var/www/html/artisan'
            - 'serve'
            - '--host=0.0.0.0'
            - '--port=80'
            - '--no-reload'
        extra_hosts:
            - 'host.docker.internal:host-gateway'
        ports:
            - '${DEBUG_APP_PORT:-8030}:80'
        environment:
            WWWUSER: '${WWWUSER}'
            LARAVEL_SAIL: 1
            SUPERVISOR_PHP_USER: 'sail'
            APP_URL: 'https://${APP_SLUG}.${DEBUG_DOMAIN}'
            XDEBUG_MODE: '${SAIL_XDEBUG_DEBUG_MODE:-debug,develop}'
            XDEBUG_CONFIG: '${SAIL_XDEBUG_DEBUG_CONFIG:-client_host=host.docker.internal start_with_request=yes idekey=PHPSTORM}'
            IGNITION_LOCAL_SITES_PATH: '${PWD}'
            TELESCOPE_ENABLED: 'true'
            DEBUGBAR_ENABLED: 'true'
            # Debugbar's "open in editor" links rewrite this prefix to the host path.
            DEBUGBAR_REMOTE_SITES_PATH: '/var/www/html'
            DEBUGBAR_LOCAL_SITES_PATH: '${PWD}'
            VITE_PORT: '${VITE_PORT:-5173}'
        labels:
            - 'traefik.enable=true'
            - 'traefik.docker.network=web'
            - 'traefik.http.routers.${APP_SLUG}-debug.rule=Host(`${APP_SLUG}.${DEBUG_DOMAIN}`)'
            - 'traefik.http.routers.${APP_SLUG}-debug.priority=100'
            - 'traefik.http.routers.${APP_SLUG}-debug.entrypoints=websecure'
            - 'traefik.http.routers.${APP_SLUG}-debug.tls=true'
            - 'traefik.http.routers.${APP_SLUG}-debug.service=${APP_SLUG}-debug'
            - 'traefik.http.services.${APP_SLUG}-debug.loadbalancer.server.port=80'
        volumes:
            - '..:/var/www'
            - '.:/var/www/html'
        networks:
            - sail
            - web
        depends_on:
            redis:
                condition: service_healthy
    # Self-hosted error tracking that speaks the Sentry SDK protocol, so the Laravel and
    # Expo clients stay stock and only the DSN changes.
    bugsink:
        image: 'bugsink/bugsink:latest'
        ports:
            - '${FORWARD_BUGSINK_PORT:-8031}:8000'
        environment:
            SECRET_KEY: '${BUGSINK_SECRET_KEY}'
            CREATE_SUPERUSER: '${BUGSINK_SUPERUSER:-admin@example.org:admin}'
            BASE_URL: 'https://bugsink.${DEBUG_DOMAIN}'
            # Traefik terminates TLS, so Django only sees http without this.
            BEHIND_HTTPS_PROXY: 'True'
            # Derived from BASE_URL when unset, which would reject both the in-network
            # service name the backend posts to and the LAN address a phone posts to.
            ALLOWED_HOSTS: '${BUGSINK_ALLOWED_HOSTS:-*}'
            PORT: '8000'
            DATABASE_PATH: '/data/bugsink.sqlite3'
        volumes:
            - 'bugsink-data:/data'
        labels:
            - 'traefik.enable=true'
            - 'traefik.docker.network=web'
            - 'traefik.http.routers.${APP_SLUG}-bugsink.rule=Host(`bugsink.${DEBUG_DOMAIN}`)'
            - 'traefik.http.routers.${APP_SLUG}-bugsink.priority=100'
            - 'traefik.http.routers.${APP_SLUG}-bugsink.entrypoints=websecure'
            - 'traefik.http.routers.${APP_SLUG}-bugsink.tls=true'
            - 'traefik.http.routers.${APP_SLUG}-bugsink.service=${APP_SLUG}-bugsink'
            - 'traefik.http.services.${APP_SLUG}-bugsink.loadbalancer.server.port=8000'
        networks:
            - sail
            - web
    redis:
        image: 'redis:alpine'
        ports:
            - '${FORWARD_REDIS_PORT:-6379}:6379'
        volumes:
            - 'sail-redis:/data'
        networks:
            - sail
        healthcheck:
            test:
                - CMD
                - redis-cli
                - ping
            interval: 2s
            retries: 3
            timeout: 5s
    mailpit:
        image: 'axllent/mailpit:latest'
        ports:
            - '${FORWARD_MAILPIT_PORT:-1025}:1025'
            - '${FORWARD_MAILPIT_DASHBOARD_PORT:-8025}:8025'
        networks:
            - sail
            - web
        labels:
            - 'traefik.enable=true'
            - 'traefik.docker.network=web'
            - 'traefik.http.routers.${APP_SLUG}-mailpit.rule=Host(`mailpit.${APP_SLUG}.${BASE_DOMAIN}`)'
            - 'traefik.http.routers.${APP_SLUG}-mailpit.priority=100'
            - 'traefik.http.routers.${APP_SLUG}-mailpit.entrypoints=websecure'
            - 'traefik.http.routers.${APP_SLUG}-mailpit.tls=true'
            - 'traefik.http.services.${APP_SLUG}-mailpit.loadbalancer.server.port=8025'
networks:
    sail:
        driver: bridge
    web:
        external: true
volumes:
    sail-redis:
        driver: local
    bugsink-data:
        driver: local
