name: tests

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# The Laravel tree is a subdirectory; Actions checks out the repo root.
defaults:
  run:
    working-directory: backend

jobs:
  ci:
    runs-on: ubuntu-latest

    # PHPUnit <env> does not override an already-set process variable unless force="true", so no DB_* here.
    env:
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
      HUSKY: 0

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.5'
          tools: composer:v2
          coverage: none
          # pest-plugin-browser talks to its Playwright server over a socket.
          extensions: sockets

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      # Composer uses ~/.cache/composer where /etc/xdg exists, as on Ubuntu runners; ask it rather than guess.
      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ runner.os }}-${{ hashFiles('backend/composer.lock') }}
          restore-keys: composer-${{ runner.os }}-

      # Keyed per commit: an entry never changes once saved, so a fixed key would stop picking up new results.
      - name: Cache PHPStan and Rector results
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            backend/storage/phpstan
            backend/storage/rector
          key: analysis-${{ runner.os }}-${{ github.sha }}
          restore-keys: analysis-${{ runner.os }}-

      - name: Audit Composer dependencies
        run: composer audit --locked --abandoned=report

      - name: Setup Application
        run: composer setup

      - name: Run CI Checks
        run: composer ci:check

      - name: Install Playwright's browser
        run: node_modules/.bin/playwright install --with-deps chromium

      - name: Run the §39 journey test in a real browser
        run: composer test:browser

      - name: Check the Rector rewrites have landed
        run: composer refactor:check

      # Both frontends read packages/shared, and ci:check only typechecks backend's own tree.
      - name: Typecheck every workspace
        working-directory: .
        run: |
          npm install
          npm run typecheck

      # A stale generated.ts breaks both frontends at once and nothing else notices.
      - name: Check the generated types match the PHP they come from
        run: |
          php artisan typescript:transform
          git diff --exit-code ../packages/shared/src/generated.ts
