name: tests

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

# The Laravel tree is a subdirectory; Actions checks out the repo root.
defaults:
  run:
    working-directory: backend

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.5'
          tools: composer:v2
          coverage: none
          # pest-plugin-browser talks to its Playwright server over a socket.
          extensions: sockets

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Setup Application
        run: composer setup

      - name: Run CI Checks
        run: composer ci:check

      - name: Install Playwright's browser
        run: node_modules/.bin/playwright install --with-deps chromium

      - name: Run the §39 journey test in a real browser
        run: composer test:browser

      - name: Check the Rector rewrites have landed
        run: composer refactor:check

      # Both frontends read packages/shared, and ci:check only typechecks backend's own tree.
      - name: Typecheck every workspace
        working-directory: .
        run: |
          npm install
          npm run typecheck

      # A stale generated.ts breaks both frontends at once and nothing else notices.
      - name: Check the generated types match the PHP they come from
        run: |
          php artisan typescript:transform
          git diff --exit-code ../packages/shared/src/generated.ts
