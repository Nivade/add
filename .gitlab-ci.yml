# Merge request pipelines for branches with an open MR, branch pipelines otherwise.
workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH
    - if: $CI_COMMIT_TAG

# Applies to every included job; override with interruptible: false on jobs that should finish once started.
default:
  interruptible: true

include:
  - local: '.gitlab/ci/*.yml'
